# FormForge — Gateway nginx config
# --------------------------------
# Sits in front of the `frontend` and `backend` containers.  Terminates
# HTTP (and HTTPS if certs are mounted) and proxies `/api/*` to the
# FastAPI backend on port 8001; every other route serves the pre-built
# React SPA out of the frontend container's Nginx.

upstream ff_backend  { server backend:8001; }
upstream ff_frontend { server frontend:80; }

server {
    listen 80;
    server_name _;

    # Large uploads: match backend's MAX_UPLOAD_MB (default 25).  Keep this
    # a bit above it so nginx buffers don't chop before FastAPI validates.
    client_max_body_size 30m;

    # -- Backend API -------------------------------------------------------
    location /api/ {
        proxy_pass         http://ff_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        # WebSocket upgrade for `/api/notifications/ws`
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }

    # -- Frontend SPA + static assets -------------------------------------
    location / {
        proxy_pass         http://ff_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
