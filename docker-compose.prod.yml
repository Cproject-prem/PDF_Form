# =============================================================================
# FormForge — production overlay for docker compose
# =============================================================================

services:
  # ----- FastAPI (unchanged, still on port 8001 inside the compose network) -
  backend:
    ports: []              # no direct host publish — nginx is the front door
    restart: unless-stopped
    environment:
      SECURITY_STRICT: "true"
      SECURITY_HTTPS: "true"
      AI_ENABLED: "true"
      AI_SERVICE_URL: "http://formforge-ai:9000"
      AI_REQUEST_TIMEOUT: "30.0"
      AI_CONNECT_TIMEOUT: "5.0"

  # ----- React (built once, served as static files by nginx) ---------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        REACT_APP_BACKEND_URL: ""
    ports: []
    restart: "no"
    volumes:
      - frontend_build:/output
    command: ["sh", "-c", "cp -r /build/. /output/ && echo done"]

  # ----- AI Microservice (Private internal service only) --------------------
  formforge-ai:
    ports: []              # Private inside compose network only
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          memory: 1G

  # ----- Local LLM Ollama (Private internal service only) -------------------
  ollama:
    ports: []              # Private inside compose network only
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          memory: 2G

  # ----- nginx reverse-proxy + TLS termination ------------------------------
  nginx:
    image: nginx:1.27-alpine
    depends_on: [backend, frontend]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - frontend_build:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    restart: unless-stopped

volumes:
  frontend_build:
