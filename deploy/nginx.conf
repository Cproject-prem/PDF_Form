# =============================================================================
# FormForge — nginx reverse-proxy for DNS / online deployment
# =============================================================================
#
# Use this when you have a domain like https://formforge.mycompany.com and
# want a single-origin deployment (recommended — no CORS, no mixed content).
#
#   Frontend (React static build) → served from /usr/share/nginx/html
#   Backend (FastAPI)              → proxied at /api
#   WebSocket                      → /api/notifications/ws (auto-upgrades)
#
# Put your TLS certs in /etc/nginx/certs (e.g. via certbot or Cloudflare
# origin certs) and change `server_name` to your DNS.
# -----------------------------------------------------------------------------

# Redirect all plain HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name formforge.mycompany.com;
    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name formforge.mycompany.com;

    # --- TLS ---
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- Security headers (redundant with FastAPI SecurityHeadersMiddleware
    # but nginx applies them BEFORE anything else too — defence in depth) ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # --- Upload size ---
    client_max_body_size 50m;

    # --- Frontend (React static build) ---
    root  /usr/share/nginx/html;
    index index.html;

    location / {
        # SPA — every unknown path falls back to index.html so react-router
        # can handle the route client-side.
        try_files $uri /index.html;
    }

    # --- Backend API ---
    location /api/ {
        proxy_pass         http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket support (needed for /api/notifications/ws)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # --- Static uploads (served through FastAPI so RLS & auth apply) ---
    # No extra rules needed — /api/files/... goes through the /api/ block.
}
