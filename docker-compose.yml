# =============================================================================
#  FormForge — docker-compose (portable, single command boot)
# =============================================================================

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - formforge_mongo_data:/data/db
    ports:
      - "127.0.0.1:27017:27017"      # Dev only; bound to localhost for security
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 20s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      MONGO_URL: "mongodb://mongo:27017"
      LOCAL_UPLOAD_ROOT: "/app/backend/uploads/local"
      LOCAL_PLANT_DOCS_ROOT: "/app/backend/uploads/local/plants"
      LOCAL_PDF_TEMPLATES_ROOT: "/app/backend/uploads/pdf"
      LOCAL_COMPLETED_PDF_ROOT: "/app/backend/uploads/completed"
      LOCAL_ASSETS_ROOT: "/app/backend/uploads/assets"
      BACKUP_ROOT: "/app/backend/uploads/backups"
      AI_ENABLED: "true"
      AI_SERVICE_URL: "http://formforge-ai:9000"
      AI_REQUEST_TIMEOUT: "30.0"
      AI_CONNECT_TIMEOUT: "5.0"
    volumes:
      - formforge_uploads:/app/backend/uploads/local
      - formforge_completed:/app/backend/uploads/completed
      - formforge_assets:/app/backend/uploads/assets
      - formforge_pdf_templates:/app/backend/uploads/pdf
      - formforge_backups:/app/backend/uploads/backups
    depends_on:
      mongo:
        condition: service_healthy
    expose:
      - "8001"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        REACT_APP_BACKEND_URL: ""
    restart: unless-stopped
    expose:
      - "80"

  # Optional Auxiliary AI Microservice (Completely Isolated)
  formforge-ai:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AI_ENABLED: "true"
      AI_PORT: "9000"
      OLLAMA_URL: "http://ollama:11434"
      OLLAMA_MODEL: "gemma"
      VECTOR_DB_PATH: "/app/data/vector_db"
      MAX_CONCURRENT_REQUESTS: "10"
      REQUEST_TIMEOUT_SECONDS: "30.0"
      CONNECT_TIMEOUT_SECONDS: "5.0"
    volumes:
      - formforge_vector_data:/app/data/vector_db
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional Local LLM Engine (Internal Network Only)
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - formforge_ollama_models:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend

volumes:
  formforge_mongo_data:
  formforge_uploads:
  formforge_completed:
  formforge_assets:
  formforge_pdf_templates:
  formforge_backups:
  formforge_vector_data:
  formforge_ollama_models:
